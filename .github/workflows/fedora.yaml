name: Build WhatsApp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    steps:
      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y \
            git \
            curl \
            wget \
            file \
            tar \
            gzip \
            gcc \
            gcc-c++ \
            make \
            pkg-config \
            openssl-devel \
            webkit2gtk4.1-devel \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            libxdo-devel \
            nodejs \
            npm

      - name: Checkout
        uses: actions/checkout@v4

      # THIS WAS MISSING
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustc --version
          cargo --version

      - name: Install Pake
        run: |
          npm install -g pake-cli
          pake --version

      - name: Build WhatsApp RPM
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"

          pake "https://web.whatsapp.com" \
            --name "WhatsApp" \
            --targets rpm

      - name: Find RPM
        run: |
          echo "===== RPM FILES ====="
          find . -type f -name "*.rpm" -print

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Fedora-RPM
          path: "**/*.rpm"
          if-no-files-found: error
